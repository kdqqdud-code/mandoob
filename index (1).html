  $("#adminTabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; adminTab = b.dataset.t; renderAdmin(); });
  $("#adminList").addEventListener("click", e => {
    const h = e.target.closest("button[data-health-a]");
    if (h){ if (h.dataset.healthA === "repair") repairIncompleteDriver(h.dataset.id); else renderAdmin(); return; }
    const m = e.target.closest("button[data-m]");
    if (m){ const id = m.dataset.id, x = store.msgs().find(y=>y.id===id); if (!x) return;
      if (m.dataset.m==="read") store.msgUpdate(id, { read: !x.read });
      if (m.dataset.m==="del") store.msgDelete(id);
      if (m.dataset.m==="stop" && x.driverId){ store.update(x.driverId,{status:"stopped", available:false}); store.msgUpdate(id, { read:true }); toast("تم إيقاف المندوب"); }
      if (!FB.on) renderAdmin(); return; }
    const b = e.target.closest("button[data-a]"); if (!b) return;
    const id = b.dataset.id, a = b.dataset.a, d = store.get(id); if (!d) return;
    if (a==="activate" || a==="renew"){ activatePaid(id); toast("تم التفعيل لمدة " + CONFIG.days + " يوم" + (FB.on && CONFIG.trialFree ? " (فترة تجريبية)" : " (دفع يدوي)")); }
    if (a==="resume"){ store.update(id,{status: d.paidUntil && d.paidUntil > Date.now() ? "active" : "unpaid"}); toast("تم إلغاء الإيقاف"); }
    if (a==="stop"){ store.update(id,{status:"stopped", available:false}); toast("تم الإيقاف"); }
    if (a==="feat"){ store.update(id,{featured:!d.featured}); }
    if (a==="del"){ if (confirm(`حذف ${d.name} نهائياً؟`)){ store.remove(id); toast("تم الحذف"); } }
    renderAdmin();
  });
}
function renderAdmin(){
  const signedIn = FB.on && FB.user && !FB.user.isAnonymous, authed = FB.on && FB.isAdmin && FB.all !== null;
  $("#adminLocal").classList.toggle("hidden", FB.on);
  $("#pinForm").classList.toggle("hidden", !FB.on || signedIn);
  $("#adminDenied").classList.toggle("hidden", !(signedIn && FB.adminChecked && !FB.isAdmin));
  $("#adminPanel").classList.toggle("hidden", !authed); if (!authed) return;
  const all = store.all();
  const G = { pending: all.filter(d=>d.status==="pending"), incomplete: all.filter(d=>d.status==="incomplete"), unpaid: all.filter(d=>d.status==="unpaid"), active: all.filter(isLive), expired: all.filter(d=>d.status==="active" && d.paidUntil && d.paidUntil<=Date.now()), stopped: all.filter(d=>d.status==="stopped") };
  const since = Date.now() - 30*DAY;
  const paid30 = all.reduce((n,d) => n + (d.payHist||[]).filter(x => x > since).length, 0);
  const total = all.reduce((n,d) => n + (d.payHist||[]).length, 0);
  $("#stats").innerHTML = `<div class="stat"><b>${G.active.length}</b><span>مشترك فعّال</span></div><div class="stat"><b>${(paid30*CONFIG.price).toFixed(3)}</b><span>ر.ع دخل آخر 30 يوم</span></div><div class="stat"><b>${(total*CONFIG.price).toFixed(3)}</b><span>ر.ع إجمالي الدخل</span></div>`;
  G.inbox = store.msgs();
  const unread = G.inbox.filter(m=>!m.read).length;
  const labels = { health:"فحص الصحة", inbox:`📥 الرسائل والبلاغات${unread?" ("+unread+" جديد)":""}`, pending:"بانتظار التفعيل", active:"فعّال", incomplete:"دفع ولم يكمل بياناته", unpaid:"بانتظار الدفع", expired:"منتهي", stopped:"موقوف" };
  $("#adminTabs").innerHTML = Object.keys(labels).map(k=>`<button type="button" class="chip" data-t="${k}" aria-pressed="${k===adminTab}">${labels[k]}${k==="inbox" || k==="health" ? "" : " (" + G[k].length + ")"}</button>`).join("");
  if (adminTab === "health"){ renderHealth(all); return; }
  const list = G[adminTab];
  if (adminTab==="inbox"){
    $("#adminList").innerHTML = list.length ? list.map(m => `<div class="row" style="${m.read?"opacity:.65":""}">
      <div class="r-head"><b>${m.type==="report" ? "🚩 بلاغ عن " + esc(m.driverName) : "💬 " + esc(m.name || "رسالة من زائر")}</b><span class="hint">${new Date(m.at).toLocaleString("ar-OM-u-nu-latn")}</span></div>
      <div class="r-meta">${m.type==="report" ? "السبب: " + esc(m.reason) + (m.text ? "، " + esc(m.text) : "") : esc(m.text)}${m.reach ? "<br>للرد: <bdi dir=\"ltr\">" + esc(m.reach) + "</bdi>" : ""}</div>
      <div class="r-actions"><button type="button" class="btn btn-sm btn-ghost" data-m="read" data-id="${esc(m.id)}">${m.read?"غير مقروء":"تم الاطلاع"}</button>${m.type==="report" && m.driverId ? `<button type="button" class="btn btn-sm btn-danger" data-m="stop" data-id="${esc(m.id)}">إيقاف المندوب</button>` : ""}<button type="button" class="btn btn-sm btn-ghost" data-m="del" data-id="${esc(m.id)}">حذف</button></div></div>`).join("")
      : `<div class="empty"><p style="margin:0">ما في رسائل.</p></div>`;
    return;
  }
  $("#adminList").innerHTML = list.length ? list.map(d => {
    const btn = (a,tx,c) => `<button type="button" class="btn btn-sm ${c}" data-a="${a}" data-id="${esc(d.id)}">${tx}</button>`;
    const acts = adminTab==="pending" ? btn("activate", CONFIG.trialFree ? "تفعيل (بعد التحقق من الرقم)" : "تفعيل (بعد التأكد من الدفع)","btn-ok")+btn("stop","إيقاف","btn-ghost")+btn("del","حذف","btn-danger") : adminTab==="incomplete" ? btn("del","حذف","btn-danger") : adminTab==="unpaid" ? btn("activate","تفعيل (دفع يدوي)","btn-ok")+btn("del","حذف","btn-danger") : adminTab==="active" ? btn("feat", d.featured?"إلغاء التمييز":"تمييز","btn-ghost")+btn("renew","تمديد " + CONFIG.days + " يوم","btn-ghost")+btn("stop","إيقاف","btn-danger") : adminTab==="expired" ? btn("renew","تجديد (دفع يدوي)","btn-ok")+btn("stop","إيقاف","btn-ghost") : btn("resume","إلغاء الإيقاف","btn-ok")+btn("del","حذف","btn-danger");
    const bits = [d.verifiedBy==="phone" ? "رقم موثّق برسالة" : d.verifiedBy==="email" ? "تحقق بالإيميل، الرقم غير موثّق: تأكد منه قبل التفعيل" : "", d.wil ? `${esc(d.wil)}، ${esc(d.gov)}` : "بدون ولاية", `دفع ${(d.payHist||[]).length} مرة`, d.paidUntil ? "ينتهي " + new Date(d.paidUntil).toLocaleDateString("ar-OM-u-nu-latn") : "لم يدفع", d.verifiedBy==="email"?`تحقق بالإيميل (${esc(d.email)})`:"تحقق بالواتساب", `اللغة: ${d.lang==="en"?"English":d.lang==="ur"?"اردو":"عربي"}`, isOnline(d)?"متصل الآن":"غير متصل"];
    bits.push("سُجّل " + new Date(d.createdAt).toLocaleDateString("ar-OM-u-nu-latn"));
    return `<div class="row"><div class="r-head"><b>${esc(d.name || d.email || "بدون اسم")}${d.featured?' <span class="badge feat">مميز</span>':""}</b><a href="https://wa.me/968${esc(d.phone)}" target="_blank" rel="noopener" dir="ltr">+968 ${esc(d.phone)}</a></div><div class="r-meta">${bits.join("، ")}</div><div class="r-actions">${acts}</div></div>`;
  }).join("") : `<div class="empty"><p style="margin:0">ما في شي في هذا القسم.</p></div>`;
}

/* ===== التنقل ===== */
let curView = "home";
function route(keep){
  let v = (location.hash||"#home").slice(1); const views = ["home","order","join","account","terms","admin"];
  if (v==="privacy"){ termsTab = "privacy"; renderTerms(); v = "terms"; }
  const cur = views.includes(v) ? v : "home"; const changed = cur !== curView; curView = cur;
  views.forEach(x => $("#view-"+x).classList.toggle("hidden", x!==cur));
  const tab = cur==="join" ? "account" : cur;
  document.querySelectorAll(".bnav a[data-v]").forEach(a => { if (a.dataset.v===tab) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  $("#bnav").classList.toggle("hidden", cur==="admin");
  if (cur!=="account") clearInterval(onlineTimer);
  if (cur==="order") renderOrder();
  if (cur==="join") renderJoin(keep===true);
  if (cur==="account") renderAccount();
  if (cur==="admin") renderAdmin();
  if (keep!==true || changed) window.scrollTo(0,0);
}

/* ===== التشغيل ===== */
document.querySelectorAll(".lang-opt").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
$("#langBtn").addEventListener("click", openLangGate);
$("#spSkip").addEventListener("click", hideSplash);
document.addEventListener("keydown", e => { if (e.key==="Escape" && ls.get(LKEY) && !$("#langGate").classList.contains("hidden")){ $("#langGate").classList.add("hidden"); document.body.classList.remove("lock"); } });
$("#yr").textContent = new Date().getFullYear();
setInterval(tick, 1000);
initOrder(); initJoin(); initAdmin(); initMessages();
window.addEventListener("hashchange", () => route());
const saved = ls.get(LKEY);
LANG = LANGS[saved] ? saved : "ar";
applyLang();
if (!saved) openLangGate(); else if (location.hash==="" || location.hash==="#home") showSplash();
initBackend();
</script>
